name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t investment-research-api:ci .
      - name: Start container
        run: docker run -d --name investment-research-api-ci -p 8000:8000 -e PORT=8000 investment-research-api:ci
      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs investment-research-api-ci
          exit 1
      - name: Verify production readiness fails closed without secrets
        run: |
          code=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/v1/ready)
          cat /tmp/ready.json
          test "$code" = "503"
      - name: Container logs
        if: always()
        run: docker logs investment-research-api-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f investment-research-api-ci || true
